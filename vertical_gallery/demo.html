<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AVĀRTĀ ® — Vertical Slide Gallery Component Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="vertical_gallery.css">
  <link rel="stylesheet" href="../detail_view/detail_view.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #06080e;
      color: #ffffff;
      overflow: hidden;
      font-family: 'Space Grotesk', sans-serif;
    }
    #gallery-mount-target {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }
  </style>
</head>
<body>

  <!-- Isolated Mount Container -->
  <main id="gallery-mount-target"></main>

  <script src="vertical_gallery.js"></script>
  <script src="../detail_view/detail_view.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Instantiate and mount component
      const gallery = new VerticalSlideGallery({
        target: '#gallery-mount-target',
        items: [
          {
            image: '../assets/paintings/starry_night.jpg',
            title: 'The Starry Night',
            category: 'Post-Impressionism · Masterwork',
            year: '1889'
          },
          {
            image: '../assets/paintings/birth_of_venus.jpg',
            title: 'The Birth of Venus',
            category: 'Early Renaissance · Tempera',
            year: '1485'
          },
          {
            image: '../assets/paintings/the_kiss.jpg',
            title: 'The Kiss (Der Kuss)',
            category: 'Vienna Secession · Gold Leaf',
            year: '1908'
          },
          {
            image: '../assets/paintings/great_wave.jpg',
            title: 'The Great Wave off Kanagawa',
            category: 'Edo Period · Ukiyo-e Woodblock',
            year: '1831'
          },
          {
            image: '../assets/paintings/wanderer.jpg',
            title: 'Wanderer Above the Sea of Fog',
            category: 'Romanticism · Oil on Canvas',
            year: '1818'
          },
          {
            image: '../assets/paintings/girl_pearl_earring.jpg',
            title: 'Girl with a Pearl Earring',
            category: 'Dutch Golden Age · Tronie',
            year: '1665'
          }
        ],
        leftPanel: {
          logo: 'AVĀRTĀ ®',
          badge: 'VISUAL STUDIO',
          tag: 'Curated Archive',
          ctaText: 'Join Us Now',
          ctaHref: '../index.html'
        },
        rightPanel: {
          metaLabel: 'Curated Collection',
          seeAllText: 'See all',
          onSeeAll: () => {
            window.location.href = '../categories.html';
          }
        },
        onSlideChange: (index, item) => {
          console.log(`[Slide Changed] Index: ${index}, Title: ${item.title}`);
        }
      });

      // Expose to window for manual testing in devtools
      window.verticalGallery = gallery;
    });
  </script>
</body>
</html>
